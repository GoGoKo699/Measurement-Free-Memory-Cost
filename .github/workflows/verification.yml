name: Verify science and report

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  finite-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify the finite identities and constructions
        run: |
          python -m pip install -r verification/requirements.txt
          python verification/run_all.py

  report-texlive-2025:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Create the report output directory
        run: mkdir -p learning/report
      - name: Compile with TeX Live 2025
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b
        with:
          working_directory: learning/source
          root_file: Measurement_Free_Memory_Cost_Report.tex
          texlive_version: '2025'
          os: debian
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=../report
          pre_compile: |
            mkdir -p ../report
            rm -f ../report/Measurement_Free_Memory_Cost_Report.pdf ../report/Measurement_Free_Memory_Cost_Report.log
            pdflatex --version | tee ../report/compiler-version.txt
            grep -F 'TeX Live 2025' ../report/compiler-version.txt
            tlmgr --version > ../report/texlive-manager-version.txt
            sha256sum Measurement_Free_Memory_Cost_Report.tex > ../report/source.sha256
          post_compile: |
            test -s ../report/Measurement_Free_Memory_Cost_Report.pdf
            grep -F 'TeX Live 2025' ../report/Measurement_Free_Memory_Cost_Report.log
            sha256sum Measurement_Free_Memory_Cost_Report.tex ../report/Measurement_Free_Memory_Cost_Report.pdf > ../report/compiled.sha256
      - name: Record the resolved container image
        run: docker image inspect ghcr.io/xu-cheng/texlive-historic-debian:2025 --format '{{index .RepoDigests 0}}' > learning/report/container-image.txt
      - name: Retain the fresh PDF and matching build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explanatory-report-texlive-2025
          if-no-files-found: error
          path: |
            learning/report/Measurement_Free_Memory_Cost_Report.pdf
            learning/source/Measurement_Free_Memory_Cost_Report.tex
            learning/report/Measurement_Free_Memory_Cost_Report.log
            learning/report/compiler-version.txt
            learning/report/texlive-manager-version.txt
            learning/report/container-image.txt
            learning/report/source.sha256
            learning/report/compiled.sha256

  hosted-mathematics:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Install the browser and mathematical reference renderer
        run: |
          npm install --prefix "$RUNNER_TEMP/math-check" playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/math-check/node_modules/.bin/playwright" install --with-deps chromium
      - name: Inspect commit-pinned GitHub pages
        env:
          NODE_PATH: ${{ runner.temp }}/math-check/node_modules
        run: |
          node .github/scripts/capture_hosted_math.cjs --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_REVISION" --output "$RUNNER_TEMP/hosted-math"
      - name: Retain the hosted comparison and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-mathematics
          if-no-files-found: warn
          path: ${{ runner.temp }}/hosted-math
