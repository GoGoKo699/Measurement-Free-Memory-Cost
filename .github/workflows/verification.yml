name: Verify science, resource figures, and hosted mathematics

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  finite-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify the finite identities and constructions
        run: |
          python -m pip install -r verification/requirements.txt
          python verification/run_all.py
          python verification/check_learning.py

  resource-comparison:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce the resource curves and finite certificates
        run: |
          python -m pip install -r verification/Graph/requirements.txt
          python verification/Graph/generate_plots.py --check
          python verification/Graph/generate_figures.py --check

  hosted-mathematics:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Install the browser and mathematical reference renderer
        run: |
          npm install --prefix "$RUNNER_TEMP/math-check" playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/math-check/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-lmodern fonts-stix
          fc-match math
      - name: Inspect commit-pinned GitHub pages
        env:
          NODE_PATH: ${{ runner.temp }}/math-check/node_modules
        run: |
          node .github/scripts/capture_hosted_math.cjs --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_REVISION" --output "$RUNNER_TEMP/hosted-math"
      - name: Retain the hosted comparison and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-mathematics
          if-no-files-found: warn
          path: ${{ runner.temp }}/hosted-math

